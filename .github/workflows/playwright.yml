name: Playwright Tests

# Manual only: the QA workflow (qa.yml) now runs smoke tests on push/PR and the scheduled suites.
on:
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Run navigation tests
        run: npm run test:navigation

      - name: Run form tests
        run: npm run test:forms

      - name: Run functional tests
        run: npx playwright test tests/functional/ --reporter=list
        continue-on-error: true

      - name: Run responsive tests
        run: npm run test:responsive
        continue-on-error: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
